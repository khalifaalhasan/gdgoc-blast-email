version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: blast_email_redis
    ports:
      - "6379:6379"
    restart: always

  db:
    image: postgres:15-alpine
    container_name: blast_email_db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-blast_email}
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: ${GHCR_IMAGE_BACKEND:-backend}
    container_name: blast_email_backend
    command: sh -c "alembic upgrade head && uvicorn src.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-blast_email}
      - REDIS_URL=redis://redis:6379/0
      - FRONTEND_URL=${FRONTEND_URL}
      - BACKEND_URL=${BACKEND_URL}
      - SENDER_NAME=${SENDER_NAME}
      - SENDER_EMAIL=${SENDER_EMAIL}
    depends_on:
      - db
      - redis
    restart: always
    volumes:
      - ./backend/temp_certs:/app/temp_certs
      - ./backend/credentials.json:/app/credentials.json:ro

  celery_worker:
    image: ${GHCR_IMAGE_BACKEND:-backend}
    container_name: blast_email_celery
    command: celery -A src.worker.celery_app worker -l info
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-blast_email}
      - REDIS_URL=redis://redis:6379/0
      - FRONTEND_URL=${FRONTEND_URL}
      - BACKEND_URL=${BACKEND_URL}
      - SENDER_NAME=${SENDER_NAME}
      - SENDER_EMAIL=${SENDER_EMAIL}
    depends_on:
      - db
      - redis
      - backend
    restart: always
    volumes:
      - ./backend/temp_certs:/app/temp_certs
      - ./backend/credentials.json:/app/credentials.json:ro

  frontend:
    image: ${GHCR_IMAGE_FRONTEND:-frontend}
    container_name: blast_email_frontend
    ports:
      - "80:80"
    restart: always
    depends_on:
      - backend

volumes:
  postgres_data:
