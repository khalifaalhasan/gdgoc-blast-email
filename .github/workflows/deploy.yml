name: Deploy to Server

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  # Converts repository name to lowercase for Docker image name
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to the Container registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata (tags, labels) for Docker
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

    # Create frontend .env for build args
    - name: Prepare Frontend Env for Build
      run: |
        echo "${{ secrets.ENV_FE }}" > frontend/.env
        # Remove .env from .dockerignore so it is included in the build context
        sed -i '/^\.env$/d' frontend/.dockerignore || true
        sed -i '/^\.env\.\*$/d' frontend/.dockerignore || true

    - name: Build and push Backend image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Build and push Frontend image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: true
        tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Setup SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Add Known Hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan -p ${{ secrets.VPS_PORT }} -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

    - name: Prepare Deployment Files
      run: |
        mkdir -p deploy/backend
        cp docker-compose.prod.yml deploy/docker-compose.yml
        
        # Write .env file
        echo "${{ secrets.ENV_BE }}" > deploy/.env
        echo "${{ secrets.ENV_FE }}" >> deploy/.env
        
        # Inject GHCR image variables to .env so docker-compose knows what to pull
        echo "" >> deploy/.env
        echo "GHCR_IMAGE_BACKEND=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-backend:latest" | tr '[:upper:]' '[:lower:]' >> deploy/.env
        echo "GHCR_IMAGE_FRONTEND=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-frontend:latest" | tr '[:upper:]' '[:lower:]' >> deploy/.env
        
        # Decode base64 credentials
        echo "${{ secrets.GOOGLE_CREDENTIALS_JSON }}" | base64 -d > deploy/backend/credentials.json

    - name: Sync configuration files via rsync
      run: |
        # Hanya copy folder deploy/ ke VPS (tidak ada source code)
        rsync -avz -e "ssh -p ${{ secrets.VPS_PORT }}" deploy/ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_TARGET_DIR }}/

    - name: Deploy on VPS
      run: |
        ssh -p ${{ secrets.VPS_PORT }} ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
          cd ${{ secrets.VPS_TARGET_DIR }}
          
          # Login to GHCR to pull images (using PAT or GITHUB_TOKEN)
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
          
          # Pull the latest images
          docker-compose pull
          
          # Start/Restart containers with the new images
          docker-compose up -d
          
          # Clean up unused dangling images to free up space
          docker image prune -af
        EOF
